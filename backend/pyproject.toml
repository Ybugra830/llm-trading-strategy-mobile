[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-trading-strategy-backend"
version = "0.1.0"
description = "LLM Trading Strategy Mobile FastAPI backend iskeleti"
requires-python = ">=3.11"
dependencies = [
    "backtesting==0.6.6",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "openai>=1.60,<3.0",
    "pandas>=2.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "ta>=0.11,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "yfinance>=0.2.54,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["sandbox*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
